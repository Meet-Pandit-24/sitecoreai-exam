<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SitecoreAI Exam - Redirecting...</title>
</head>
<body>
    <script>
        const token = localStorage.getItem('token');
        if (token) {
            // User is logged in, redirect to exam
            window.location.href = '/exam-enhanced.html';
        } else {
            // No token, redirect to login
            window.location.href = '/login.html';
        }
    </script>
    <p>Redirecting...</p>
</body>
</html>
