<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - SitecoreAI Exam</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2d3148;
    --accent: #e53935;
    --text: #e8eaf6;
    --muted: #8f9bb3;
    --correct: #00c853;
    --wrong: #f44336;
  }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .login-container {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px;
    max-width: 400px;
    width: 100%;
  }

  .logo { font-size: 48px; text-align: center; margin-bottom: 16px; }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; text-align: center; }
  .subtitle { color: var(--muted); font-size: 13px; text-align: center; margin-bottom: 32px; }

  .form-group { margin-bottom: 16px; }
  label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; display: block; margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: rgba(255,255,255,.02);
    color: var(--text);
    font-size: 14px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  input::placeholder { color: var(--muted); }

  .button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all .2s; }
  .button.primary { background: var(--accent); color: #fff; font-size: 14px; }
  .button.primary:hover:not(:disabled) { opacity: .9; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(229, 57, 53, 0.3); }
  .button:disabled { opacity: .5; cursor: not-allowed; }

  .info-box { background: rgba(33,150,243,.1); border: 1px solid #2196f3; border-radius: 8px; padding: 12px; font-size: 12px; color: #90caf9; margin-bottom: 16px; }
  .error { background: rgba(244,67,54,.1); border: 1px solid #f44336; color: #ef5350; }
  .success { background: rgba(0,200,83,.1); border: 1px solid #00c853; color: #81c784; }

  .step { display: none; }
  .step.active { display: block; }

  .link { font-size: 12px; color: var(--muted); text-align: center; margin-top: 12px; }
  .link a { color: var(--accent); text-decoration: none; cursor: pointer; }
  .link a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="login-container">
  <div class="logo">🔐</div>
  <h1>SitecoreAI Exam</h1>
  <p class="subtitle">Login with your company email</p>

  <div id="step1" class="step active">
    <div class="info-box">✓ Only @horizontal.com emails allowed</div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="emailInput" placeholder="your.name@horizontal.com" oninput="validateEmail()" required>
    </div>
    <button class="button primary" id="sendCodeBtn" onclick="requestOTP()" disabled style="opacity:0.5;cursor:not-allowed;">Send Login Code</button>
    <div id="emailError" class="info-box error" style="display:none;margin-top:12px"></div>
    <div id="successMsg" class="info-box success" style="display:none;margin-top:12px">✓ OTP sent! Check your email</div>
  </div>

  <div id="step2" class="step">
    <p style="color:var(--muted);font-size:12px;margin-bottom:16px">6-digit code sent to <strong id="emailDisplay"></strong></p>
    <div class="form-group">
      <label>Enter Code</label>
      <input type="text" id="otpInput" placeholder="000000" maxlength="6" inputmode="numeric">
    </div>
    <button class="button primary" onclick="verifyOTP()">Verify & Login</button>
    <button class="button" style="background:transparent;border:1px solid var(--border);color:var(--text);margin-top:8px" onclick="goStep1()">← Change Email</button>
    <div id="otpError" class="info-box error" style="display:none;margin-top:12px"></div>
  </div>

  <div id="step3" class="step">
    <div class="info-box success">
      ✓ Login successful!<br>
      Redirecting to exam...
    </div>
  </div>
</div>

<script>
const API_BASE = 'https://sitecoreai-exam-production.up.railway.app';

let currentEmail = '';

function validateEmail() {
  const email = document.getElementById('emailInput').value.trim();
  const btn = document.getElementById('sendCodeBtn');
  const isValid = email && email.endsWith('@horizontal.com');
  btn.disabled = !isValid;
  btn.style.opacity = isValid ? '1' : '0.5';
  btn.style.cursor = isValid ? 'pointer' : 'not-allowed';
}

async function requestOTP() {
  const email = document.getElementById('emailInput').value.trim();
  const errorDiv = document.getElementById('emailError');

  if (!email) {
    errorDiv.textContent = 'Please enter your email';
    errorDiv.style.display = 'block';
    return;
  }

  if (!email.endsWith('@horizontal.com')) {
    errorDiv.textContent = 'Only @horizontal.com emails are allowed';
    errorDiv.style.display = 'block';
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/api/auth/request-otp`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });

    if (!res.ok) {
      throw new Error((await res.json()).error);
    }

    currentEmail = email;
    document.getElementById('emailDisplay').textContent = email;
    document.getElementById('successMsg').style.display = 'block';
    errorDiv.style.display = 'none';
    setTimeout(() => goStep2(), 1500);
  } catch(err) {
    errorDiv.textContent = err.message;
    errorDiv.style.display = 'block';
    document.getElementById('successMsg').style.display = 'none';
  }
}

async function verifyOTP() {
  const otp = document.getElementById('otpInput').value.trim();
  const errorDiv = document.getElementById('otpError');

  if (otp.length !== 6) {
    errorDiv.textContent = 'Please enter 6-digit code';
    errorDiv.style.display = 'block';
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/api/auth/verify-otp`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: currentEmail, otp })
    });

    if (!res.ok) {
      const data = await res.json();
      throw new Error(data.error);
    }

    const data = await res.json();
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));

    goStep3();
    setTimeout(() => {
      window.location.href = '/exam-enhanced.html';
    }, 2000);
  } catch(err) {
    errorDiv.textContent = err.message;
    errorDiv.style.display = 'block';
  }
}

function goStep1() {
  document.getElementById('step1').classList.add('active');
  document.getElementById('step2').classList.remove('active');
  document.getElementById('emailError').style.display = 'none';
}

function goStep2() {
  document.getElementById('step1').classList.remove('active');
  document.getElementById('step2').classList.add('active');
  document.getElementById('otpInput').focus();
}

function goStep3() {
  document.getElementById('step2').classList.remove('active');
  document.getElementById('step3').classList.add('active');
}

// Check if already logged in
if (localStorage.getItem('token')) {
  window.location.href = '/exam-enhanced.html';
}

// OTP input: auto-focus next field
document.getElementById('otpInput')?.addEventListener('input', (e) => {
  e.target.value = e.target.value.replace(/\D/g, '');
  if (e.target.value.length === 6) {
    verifyOTP();
  }
});
</script>

</body>
</html>
